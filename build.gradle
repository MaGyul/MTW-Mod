plugins {
	id 'fabric-loom' version '1.6-SNAPSHOT'
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.
	maven {
		url = "https://cursemaven.com"
	}

	maven {
		name = "Modrinth"
		url = "https://api.modrinth.com/maven"
	}

	maven {
		url = "https://maven.kyrptonaught.dev"
	}

	maven {
		url = "https://maven.repository.redhat.com/ga/"
	}

	maven {
		url = "https://s01.oss.sonatype.org/content/repositories/snapshots"
	}

	flatDir {
		dirs 'libs'
	}
}

loom {
    splitEnvironmentSourceSets()

	mods {
		"mtwmod" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}

	accessWidenerPath = file("src/main/resources/mtwmod.accesswidener")
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

	var modrinthList = List.of(
			project.modmenu_version,
			project.voicechat_version,
			project.command_block_ide_version,
			project.axiom_version
	)

	for (String mod : modrinthList) {
		modImplementation "maven.modrinth:$mod"
	}
	modImplementation "dev.mtwmod:mtwmod-resource:1.0.0"
	include modImplementation("dev.mtwmod:mtwmod-skinpreset:1.0.1")

	implementation "dnsjava:dnsjava:3.5.3"
	implementation "dev.mtwmod:terminalconsoleappender:1.4.0"
	implementation "org.jline:jline:3.25.1"

//	var ultralight_version = '0.0.2-SNAPSHOT'
//
//	include implementation("net.janrupf.ultralight:ultralight-java-reborn-core:$ultralight_version")
//	var ultralight_jni = "net.janrupf.ultralight:ultralight-java-reborn-platform-jni:$ultralight_version"
//	include implementation(ultralight_jni)

//	for (String arch : ["linux-x64", "win-x64", "mac-x64"]) {
//		implementation "$ultralight_jni:$arch"
//	}
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 17
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_17
	targetCompatibility = JavaVersion.VERSION_17
}

jar {
	from("LICENSE") {
		rename { "${it}_${project.base.archivesName.get()}"}
	}
}

// configure the maven publication
publishing {
	publications {
		mavenJava(MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}